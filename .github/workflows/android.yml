name: apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null || true
          set -o pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Assemble
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect apk
        run: cp app/build/outputs/apk/release/app-release.apk sabees.apk

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: سبيس
          make_latest: true
          fail_on_unmatched_files: true
          files: sabees.apk
          body: |
            ملف التثبيت لجوال أندرويد.
            اسمه في النظام: سبيس، ويظهر ضمن الألعاب.
            التصوير وتسجيل الشاشة متاحان.
